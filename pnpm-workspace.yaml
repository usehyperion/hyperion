allowBuilds:
  esbuild: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^1.4.0
  vite-plus: ^1.4.0
minimumReleaseAgeExclude:
  - "@sveltejs/kit"
  - "@ui-sdk/*"
  - "@voidzero-dev/*"
  - "svelte"
  - "vite-plus"
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - "vite"
  allowedVersions:
    vite: "*"
permissions:
  "@tanstack/svelte-hotkeys":
    skills: true
  "@ui-sdk/core":
    skills: true

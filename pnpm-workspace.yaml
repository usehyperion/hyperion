allowBuilds:
  esbuild: false
catalog:
  "@tauri-apps/api": ^3.0.0-alpha.3
  vite: npm:@voidzero-dev/vite-plus-core@^1.5.0
  vite-plus: latest
minimumReleaseAgeExclude:
  - "@sveltejs/kit"
  - "@voidzero-dev/*"
  - "svelte"
  - vite-plus
overrides:
  # @tauri-store/svelte pins @tauri-apps/api@^2; keep a single Tauri 3 copy
  "@tauri-apps/api": "catalog:"
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  esbuild: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
minimumReleaseAgeExclude:
  - "@sveltejs/kit"
  - "@ui-sdk/*"
  - "@voidzero-dev/*"
  - "svelte"
  - "vite-plus"
overrides:
  vite@*: "catalog:"
permissions:
  "@tanstack/svelte-hotkeys":
    skills: true
  "@ui-sdk/core":
    skills: true
skills:
  dirs:
    - .claude/skills

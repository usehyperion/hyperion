name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA). Defaults to the selected branch.
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.artifact-target-name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-target-name: aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - os: macos-latest
            artifact-target-name: x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - os: blacksmith-4vcpu-ubuntu-2404
            artifact-target-name: x86_64-unknown-linux-gnu
            rust-target: ""
            args: --bundles appimage,deb
          - os: blacksmith-4vcpu-ubuntu-2404-arm
            artifact-target-name: aarch64-unknown-linux-gnu
            rust-target: ""
            args: --bundles appimage,deb
          - os: blacksmith-4vcpu-windows-2025
            artifact-target-name: aarch64-pc-windows-msvc
            rust-target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis
          - os: blacksmith-4vcpu-windows-2025
            artifact-target-name: x86_64-pc-windows-msvc
            rust-target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config libssl-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-23
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.artifact-target-name }}

      - name: Remove bundles restored from cache
        shell: bash
        run: rm -rf src-tauri/target/bundle src-tauri/target/*/bundle src-tauri/target/*/*/bundle

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build app
        shell: bash
        run: pnpm tauri build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload app bundles
        uses: actions/upload-artifact@v7
        with:
          name: App bundle (${{ matrix.artifact-target-name }})
          if-no-files-found: error
          path: |
            src-tauri/target/**/bundle/macos/*.app.tar.gz*
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/appimage/*.AppImage*
            src-tauri/target/**/bundle/deb/*.deb*
            src-tauri/target/**/bundle/nsis/*-setup.exe*

      - name: Remove bundles from cached target directory
        if: always()
        shell: bash
        run: rm -rf src-tauri/target/bundle src-tauri/target/*/bundle src-tauri/target/*/*/bundle

name: Release

concurrency:
  group: release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build assets for. Leave empty to run release-please."
        required: false
        type: string
  push:
    branches:
      - main

jobs:
  release:
    name: Generate release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.existing.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.existing.outputs.tag_name }}
    steps:
      - id: existing
        name: Look up existing release
        if: ${{ inputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" --json tagName > /dev/null
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - id: release
        name: Open pull request
        if: ${{ !inputs.tag }}
        uses: googleapis/release-please-action@v5
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.pr }}
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}

      - name: Bump Cargo lockfile
        if: ${{ steps.release.outputs.pr }}
        run: |
          cd src-tauri

          PKG_NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          PKG_VER=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')

          cargo update -p "$PKG_NAME" --precise "$PKG_VER"

          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git diff-index --quiet HEAD || git commit -m "chore: update Cargo.lock" && git push

  build:
    name: Build
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.release.outputs.tag_name }}
    secrets: inherit

  publish:
    name: Publish
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION_TAG: ${{ needs.release.outputs.tag_name }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
    steps:
      - name: Download app bundles
        uses: actions/download-artifact@v8
        with:
          path: bundles

      - name: Collect release files
        run: |
          mkdir dist

          stage() {
            local target="$1" pattern="$2" dest="$3" matches count
            matches=$(find "bundles/App bundle ($target)" -type f -name "$pattern")
            count=$(printf '%s' "$matches" | grep -c . || true)
            if [ "$count" -ne 1 ]; then
              echo "::error::Expected exactly one '$pattern' for $target, found $count: $matches"
              exit 1
            fi
            cp "$matches" "dist/$dest"
            if [ -f "$matches.sig" ]; then
              cp "$matches.sig" "dist/$dest.sig"
            fi
          }

          stage aarch64-apple-darwin     '*.app.tar.gz'  Hyperion-aarch64.app.tar.gz
          stage aarch64-apple-darwin     '*.dmg'         Hyperion-aarch64.dmg
          stage x86_64-apple-darwin      '*.app.tar.gz'  Hyperion-x64.app.tar.gz
          stage x86_64-apple-darwin      '*.dmg'         Hyperion-x64.dmg
          stage x86_64-unknown-linux-gnu '*.AppImage'    Hyperion-amd64.AppImage
          stage x86_64-unknown-linux-gnu '*.deb'         Hyperion-amd64.deb
          stage aarch64-unknown-linux-gnu '*.AppImage'   Hyperion-arm64.AppImage
          stage aarch64-unknown-linux-gnu '*.deb'        Hyperion-arm64.deb
          stage x86_64-pc-windows-msvc   '*-setup.exe'   Hyperion-x64.exe
          stage aarch64-pc-windows-msvc  '*-setup.exe'   Hyperion-arm64.exe

          ls -la dist

      - name: Fetch release notes
        run: gh release view "$VERSION_TAG" --json body --jq '.body' > release-notes.md

      - name: Generate update manifests
        run: |
          VERSION="${VERSION_TAG#v}"

          manifest() {
            jq -n \
              --arg version "$VERSION" \
              --arg base "$1" \
              --rawfile notes release-notes.md \
              --rawfile macArm dist/Hyperion-aarch64.app.tar.gz.sig \
              --rawfile macX64 dist/Hyperion-x64.app.tar.gz.sig \
              --rawfile appImage dist/Hyperion-amd64.AppImage.sig \
              --rawfile deb dist/Hyperion-amd64.deb.sig \
              --rawfile appImageArm dist/Hyperion-arm64.AppImage.sig \
              --rawfile debArm dist/Hyperion-arm64.deb.sig \
              --rawfile winX64 dist/Hyperion-x64.exe.sig \
              --rawfile winArm dist/Hyperion-arm64.exe.sig \
              '
              def entry($file; $sig): { signature: $sig, url: "\($base)/\($file)" };
              {
                version: $version,
                notes: $notes,
                pub_date: (now | todateiso8601),
                platforms: {
                  "darwin-aarch64":         entry("Hyperion-aarch64.app.tar.gz"; $macArm),
                  "darwin-aarch64-app":     entry("Hyperion-aarch64.app.tar.gz"; $macArm),
                  "darwin-x86_64":          entry("Hyperion-x64.app.tar.gz"; $macX64),
                  "darwin-x86_64-app":      entry("Hyperion-x64.app.tar.gz"; $macX64),
                  "linux-x86_64":           entry("Hyperion-amd64.AppImage"; $appImage),
                  "linux-x86_64-appimage":  entry("Hyperion-amd64.AppImage"; $appImage),
                  "linux-x86_64-deb":       entry("Hyperion-amd64.deb"; $deb),
                  "linux-aarch64":          entry("Hyperion-arm64.AppImage"; $appImageArm),
                  "linux-aarch64-appimage": entry("Hyperion-arm64.AppImage"; $appImageArm),
                  "linux-aarch64-deb":      entry("Hyperion-arm64.deb"; $debArm),
                  "windows-x86_64":         entry("Hyperion-x64.exe"; $winX64),
                  "windows-x86_64-nsis":    entry("Hyperion-x64.exe"; $winX64),
                  "windows-aarch64":        entry("Hyperion-arm64.exe"; $winArm),
                  "windows-aarch64-nsis":   entry("Hyperion-arm64.exe"; $winArm)
                }
              }'
          }

          : "${R2_PUBLIC_URL:?The R2_PUBLIC_URL repository variable is not set}"
          manifest "${R2_PUBLIC_URL%/}/releases/${VERSION}" > latest.json
          echo "Generated manifest for ${VERSION_TAG}:"
          cat latest.json

      - name: Check if this is the latest release
        id: latest
        run: |
          latest=$(gh release view --json tagName --jq '.tagName')
          echo "is_latest=$([ "$latest" = "$VERSION_TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Latest release is $latest, publishing $VERSION_TAG"

      - name: Upload release files to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_PAGER: ""
          # Work around incompatible checksum behavior in newer AWS CLI versions. See:
          # https://developers.cloudflare.com/r2/examples/aws/aws-cli/
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3 cp --recursive dist "s3://${R2_BUCKET}/releases/${VERSION_TAG#v}/"

          if [ "${{ steps.latest.outputs.is_latest }}" = "true" ]; then
            # Uploaded last, so clients never see a manifest before its files exist.
            aws s3 cp latest.json "s3://${R2_BUCKET}/releases/latest.json" \
              --content-type application/json \
              --cache-control "no-cache"
          fi

      - name: Upload installers to GitHub
        run: |
          gh release upload "$VERSION_TAG" --clobber \
            dist/Hyperion-aarch64.dmg \
            dist/Hyperion-x64.dmg \
            dist/Hyperion-amd64.AppImage \
            dist/Hyperion-amd64.deb \
            dist/Hyperion-arm64.AppImage \
            dist/Hyperion-arm64.deb \
            dist/Hyperion-x64.exe \
            dist/Hyperion-arm64.exe
          gh release upload "$VERSION_TAG" latest.json --clobber

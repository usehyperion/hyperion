[package]
name = "hyperion"
version = "0.11.0"
authors = ["Oliver Rose <hello@olivermrose.com>"]
edition = "2024"
publish = false

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hyperion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
debug = false
incremental = true

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
anyhow = "1.0.104"
either = "1.19.0"
futures = "0.3.34"
mimalloc = "0.1"
reqwest = { version = "0.12.28", features = ["json"] }
rustc-hash = "2.1.3"
rustls = { version = "0.23.46", features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3", features = ["formatting", "local-offset"] }
tauri = { version = "3.0.0-alpha.5", features = ["protocol-asset"] }
tauri-runtime-cef = "3.0.0-alpha.6"
tauri-plugin-deep-link = "3.0.0-alpha.3"
tauri-plugin-fs = "3.0.0-alpha.3"
tauri-plugin-notification = "3.0.0-alpha.3"
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-os = "3.0.0-alpha.3"
tauri-plugin-process = "3.0.0-alpha.3"
tauri-plugin-svelte = { version = "3", features = ["preserve-order"] }
tokio = { version = "1.54.1", features = ["macros", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
twitch_api = { version = "0.7.2", features = ["beta", "client", "helix", "reqwest"] }
keyring = "4.2.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "3.0.0-alpha.3", features = ["deep-link"] }
tauri-plugin-updater = "3.0.0-alpha.3"
tauri-plugin-window-state = "3.0.0-alpha.2"

# tauri-store is unmaintained and pinned to Tauri 2, so it's vendored with its
# Tauri dependency bumped. See vendor/README.md.
[patch.crates-io]
tauri-plugin-svelte = { path = "vendor/tauri-plugin-svelte" }
tauri-store = { path = "vendor/tauri-store" }
tauri-store-utils = { path = "vendor/tauri-store-utils" }
